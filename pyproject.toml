[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hornlab-beat-bem"
version = "0.1.0"
description = "BEAT Engine (boundary-lab) Julia BEM solver: exterior Burton-Miller and coupled FEM-BEM-LEM, on CPU, CUDA, ROCm and Apple Metal"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["hornlab_beat_bem*"]

[tool.setuptools.package-data]
hornlab_beat_bem = [
    "julia/*.jl",
    "julia/*.toml",
    "julia/src/*.jl",
    "julia/scripts/*.jl",
    "julia/tests/*.jl",
    "julia/test_meshes/*.msh",
    "julia/test_fixtures/*.msh",
    "julia_cuda/*.toml",
    "julia_metal/*.toml",
    "julia_rocm/*.toml",
    # The precompilable engine bundles. Leaving these out of the wheel does
    # not break anything visibly: solver.jl falls back to including the
    # sources, so an installed copy without them still solves -- at three
    # times the cold start, with nothing to say why.
    "julia_engine/*/*.toml",
    "julia_engine/*/src/*.jl",
]

[tool.pytest.ini_options]
markers = [
    "slow: validation tests that run a real BEM solve through Julia",
]
